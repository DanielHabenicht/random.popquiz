name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      refresh:
        description: Ignore cached question catalogs and scrape them again
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            data/package-lock.json
            popquiz/package-lock.json

      # The question catalogs are public but not committed, so they are scraped during the deploy.
      # The results are cached per month (and per version of the scrapers) to not query the
      # sources (ELWIS, sportbootfuehrerscheine.org) on every push.
      - name: Compute catalog cache key
        id: catalog-key
        run: echo "key=catalogs-$(date -u +%Y-%m)-${{ hashFiles('data/*.js', 'data/package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached catalogs
        id: catalog-cache
        if: ${{ !inputs.refresh }}
        uses: actions/cache/restore@v4
        with:
          path: data/dist
          key: ${{ steps.catalog-key.outputs.key }}

      - name: Install scraper dependencies
        working-directory: data
        run: npm ci

      - name: Scrape question catalogs
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        working-directory: data
        run: |
          npm run scrape
          npm run scrape:sks
          npm run scrape:fkn

      - name: Save catalogs to cache
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/dist
          key: ${{ steps.catalog-key.outputs.key }}

      - name: Merge catalogs
        working-directory: data
        run: npm run merge

      - name: Build app
        working-directory: popquiz
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci --ignore-scripts
          npx ng build --prod --base-href "/${{ github.event.repository.name }}/"
          # let GitHub Pages serve the app for deep links like /questions/sks/unanswered
          cp www/index.html www/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: popquiz/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
