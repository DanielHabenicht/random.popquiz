<ion-card>
  <canvas #stats height="2px" style="width:100%"></canvas>
  <ion-card-header>
    <ion-card-subtitle *ngIf="question?.category" class="category">{{ question.category }}</ion-card-subtitle>
    <ion-card-subtitle class="question-text"
      >{{ question?.question }} <ion-skeleton-text *ngIf="question == null" animated></ion-skeleton-text
    ></ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <div class="images">
      <div>
        <img
          *ngFor="let picture of question?.pictureUrls"
          [src]="'assets/images/' + picture.url"
          [title]="picture.title"
          [alt]="picture.title"
        />
      </div>
    </div>

    <!-- Open question: reveal the official answer and rate yourself -->
    <ng-container *ngIf="question?.open">
      <ion-button *ngIf="!revealed" expand="block" color="tertiary" (click)="reveal()">Antwort anzeigen</ion-button>
      <ng-container *ngIf="revealed">
        <ion-card color="light">
          <ion-card-content>
            <div class="open-answer">{{ answers[0]?.value }}</div>
            <div class="images">
              <img
                *ngFor="let picture of question?.answerPictureUrls"
                [src]="'assets/images/' + picture.url"
                [title]="picture.title"
                [alt]="picture.title"
              />
            </div>
          </ion-card-content>
        </ion-card>
        <ion-grid>
          <ion-row>
            <ion-col size="6">
              <ion-button expand="block" color="danger" [disabled]="showRight" (click)="selfAssessment(false)"
                >Nicht gewusst</ion-button
              >
            </ion-col>
            <ion-col size="6">
              <ion-button expand="block" color="success" [disabled]="showRight" (click)="selfAssessment(true)"
                >Gewusst</ion-button
              >
            </ion-col>
          </ion-row>
        </ion-grid>
      </ng-container>
    </ng-container>

    <!-- Multiple choice -->
    <ng-container *ngIf="!question?.open">
      <p *ngIf="multipleRight" class="hint">Mehrere Antworten können richtig sein.</p>
      <ion-grid>
        <ion-row>
          <ng-container *ngIf="question == null">
            <ion-col size="6" *ngFor="let i of [0, 1, 2, 3]">
              <ion-card class="answer" color="tertiary">
                <ion-card-content><ion-skeleton-text animated></ion-skeleton-text></ion-card-content>
              </ion-card>
            </ion-col>
          </ng-container>
          <ion-col size="6" *ngFor="let answer of answers">
            <ion-card (click)="answerAction(answer)" class="answer" [color]="getColor(answer)">
              <ion-card-content>
                <div>{{ answer.value }}</div>
              </ion-card-content>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
      <ion-button
        *ngIf="multipleRight"
        expand="block"
        color="tertiary"
        [disabled]="showRight || selected.size === 0"
        (click)="checkSelection()"
        >Prüfen</ion-button
      >
    </ng-container>
  </ion-card-content>
</ion-card>
