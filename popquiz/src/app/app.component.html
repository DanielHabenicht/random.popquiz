<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header><img class="logo" src="assets/icon/logo.svg" alt="" />Popquiz</ion-list-header>
          <ion-note>Bootsführerscheine üben · {{ version }}</ion-note>

          <ion-menu-toggle auto-hide="false" *ngFor="let p of mainPages">
            <ion-item routerDirection="root" [routerLink]="p.url" routerLinkActive="selected" lines="none" detail="false">
              <ion-icon slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-list id="labels-list">
          <ion-list-header>Lernen</ion-list-header>
          <ion-menu-toggle auto-hide="false" *ngFor="let p of learnPages$ | async">
            <ion-item routerDirection="root" [routerLink]="p.url" routerLinkActive="selected" lines="none" detail="false">
              <ion-icon slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-list id="settings-list">
          <ion-list-header>Einstellungen</ion-list-header>
          <ion-menu-toggle auto-hide="false">
            <ion-item button lines="none" detail="false" (click)="resetProgress()">
              <ion-icon slot="start" ios="trash-outline" md="trash-sharp" color="danger"></ion-icon>
              <ion-label>Fortschritt zurücksetzen</ion-label>
            </ion-item>
            <ion-item routerDirection="root" routerLink="/about" routerLinkActive="selected" lines="none" detail="false">
              <ion-icon slot="start" ios="information-circle-outline" md="information-circle-sharp"></ion-icon>
              <ion-label>Über die App</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
