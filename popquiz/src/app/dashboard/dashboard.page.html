<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Statistik</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page">
    <ion-list *ngFor="let group of groups">
      <ion-list-header>{{ group.title }}</ion-list-header>
      <ion-item
        *ngFor="let row of group.rows"
        button
        detail
        [routerLink]="['/questions', row.catalog.id, 'unanswered']"
        routerDirection="root"
      >
        <ion-label>
          <div class="row-title">
            <span>{{ row.catalog.title }}</span>
            <span class="count" *ngIf="row.stats$ | async as stats">{{ stats.right }} / {{ stats.total }}</span>
          </div>
          <app-progress [stats]="row.stats$ | async"></app-progress>
        </ion-label>
      </ion-item>
    </ion-list>
    <p class="note">
      Gezählt wird jeweils die letzte Antwort einer Frage. Tippe auf einen Katalog, um ihn zu lernen.
    </p>
  </div>
</ion-content>
